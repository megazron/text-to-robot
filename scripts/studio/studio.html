<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>

<script type="module">
// Studio render of the Mark 43 pack: painted-metal materials, softbox reflections, dark backdrop.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/RoomEnvironment.js";
import { toCreasedNormals } from "three/addons/BufferGeometryUtils.js";
// Decimated panels shade in facets. Every corner's normal is blended with its neighbours across smooth edges a few times, which
// keeps creases (they are already split) and lets a highlight run across a panel as it does on paint.
function smoothNormals(g, passes = 6) {
  const pos = g.attributes.position.array, nor = g.attributes.normal.array, n = pos.length / 3, key = new Map(), id = new Int32Array(n);
  const q = (i) => `${Math.round(pos[i * 3] * 50)},${Math.round(pos[i * 3 + 1] * 50)},${Math.round(pos[i * 3 + 2] * 50)},${Math.round(nor[i * 3] * 2)},${Math.round(nor[i * 3 + 1] * 2)},${Math.round(nor[i * 3 + 2] * 2)}`;
  for (let i = 0; i < n; i++) { const k = q(i); let v = key.get(k); if (v === undefined) { v = key.size; key.set(k, v); } id[i] = v; }
  const m = key.size; let N = new Float32Array(m * 3); const cnt = new Float32Array(m);
  for (let i = 0; i < n; i++) { const v = id[i]; for (let c = 0; c < 3; c++) N[v * 3 + c] += nor[i * 3 + c]; }

  return g;

const q = new URLSearchParams(location.search), W = +(q.get("w") ?? 1200), H = +(q.get("h") ?? 1500);

R.setSize(W, H); R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x070808);
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.03).texture; S.environmentIntensity = 0.5;
const M = {
  armour_red: new THREE.MeshPhysicalMaterial({ color: 0x9a0610, metalness: 0.55, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.08 }),
  armour_gold: new THREE.MeshPhysicalMaterial({ color: 0xb8904e, metalness: 0.85, roughness: 0.36, clearcoat: 0.5, clearcoatRoughness: 0.2 }),
  armour_silver: new THREE.MeshPhysicalMaterial({ color: 0xa9abb2, metalness: 0.95, roughness: 0.3 }),
  lens_glow: new THREE.MeshBasicMaterial({ color: 0xf2fbff }),
  wearer: new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.9, metalness: 0 }),

const G = new THREE.Group(); S.add(G);
for (const p of man.pieces) {
  const qv = new Uint16Array(buf, p.ov, p.nv * 3), f = new Uint16Array(buf, p.of, p.nf * 3), v = new Float32Array(p.nv * 3);
  for (let i = 0; i < p.nv; i++) for (let k = 0; k < 3; k++) v[i * 3 + k] = (p.lo[k] + qv[i * 3 + k] * p.step[k]) / 1000;
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(v, 3)); g.setIndex(new THREE.BufferAttribute(new Uint32Array(f), 1));
  const m = new THREE.Mesh(smoothNormals(toCreasedNormals(g, 0.62)), M[p.material] ?? M.armour_red); m.castShadow = m.receiveShadow = true; G.add(m);
}

  const l = new THREE.SpotLight(c, i * 14, 0, 0.5, 0.7); l.position.set(x, y, z); l.target.position.set(0, 1, 0); l.castShadow = true; l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -0.0004; S.add(l, l.target);
}

</script>
