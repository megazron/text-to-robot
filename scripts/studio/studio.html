<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three.module.js","three/addons/":"/addons/"}}</script>
<script type="module">
// Studio render of the Mark 43 pack: painted-metal materials, softbox reflections, dark backdrop.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/RoomEnvironment.js";
const q = new URLSearchParams(location.search), W = +(q.get("w") ?? 1200), H = +(q.get("h") ?? 1500);
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setSize(W, H); R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x070808);
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.03).texture; S.environmentIntensity = 0.55;
const M = {
  armour_red: new THREE.MeshPhysicalMaterial({ color: 0x5c0509, metalness: 0.8, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.08 }),
  armour_gold: new THREE.MeshPhysicalMaterial({ color: 0xc9b083, metalness: 0.92, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1 }),
  lens_glow: new THREE.MeshBasicMaterial({ color: 0xf2fbff }),
};
const man = await (await fetch("/mark43_pack.json")).json(), buf = await (await fetch("/mark43_pack.bin")).arrayBuffer();
const G = new THREE.Group(); S.add(G);
for (const p of man.pieces) {
  const qv = new Uint16Array(buf, p.ov, p.nv * 3), f = new Uint16Array(buf, p.of, p.nf * 3), v = new Float32Array(p.nv * 3);
  for (let i = 0; i < p.nv; i++) for (let k = 0; k < 3; k++) v[i * 3 + k] = (p.lo[k] + qv[i * 3 + k] * p.step[k]) / 1000;
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(v, 3)); g.setIndex(new THREE.BufferAttribute(new Uint32Array(f), 1)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, M[p.material] ?? M.armour_red); m.castShadow = m.receiveShadow = true; G.add(m);
}
// a black undersuit silhouette behind the shells
G.rotation.x = -Math.PI / 2;    // model z up -> scene y up
for (const [c, i, x, y, z] of [[0xfff2e0, 3.2, 1.6, 2.4, 1.8], [0xbfd8ff, 1.5, -2.2, 1.4, 0.8], [0xffffff, 1.2, 0, 2.2, -2.4]]) {
  const l = new THREE.SpotLight(c, i * 14, 0, 0.5, 0.7); l.position.set(x, y, z); l.target.position.set(0, 1, 0); l.castShadow = true; l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -0.0004; S.add(l, l.target);
}
const C = new THREE.PerspectiveCamera(+(q.get("fov") ?? 24), W / H, 0.05, 30);
window.shot = (az, h, dist, ly) => { const a = az * Math.PI / 180; G.rotation.z = 0; C.position.set(Math.sin(a) * dist, h, Math.cos(a) * dist); C.lookAt(0, ly, 0); R.render(S, C); return true; };
G.rotation.z = 0; G.updateMatrixWorld(true);
// model x is forward: turn it to face the camera at azimuth 0
const P = new THREE.Group(); S.add(P); P.add(G); P.rotation.y = -Math.PI / 2;
window.ready = true;
</script>
