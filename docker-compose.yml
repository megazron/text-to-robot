services:
  text-to-robot:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run api"
    ports:
      - "8787:8787"
    environment:
      # optional -- omit to run in deterministic demo mode
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PORT=8787
