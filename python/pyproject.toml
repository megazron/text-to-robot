[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttr-mujoco"
version = "0.7.0"
description = "Text to Robot Python layer: convert, simulate, render and train generated URDF robots in MuJoCo, and build printable parts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "megazron" }]
keywords = ["robotics", "text-to-robot", "urdf", "mujoco", "simulation", "3d-printing", "ros2"]
dependencies = ["mujoco>=3.1", "numpy>=1.24", "gymnasium>=0.29", "Pillow>=10"]

[project.urls]
Homepage = "https://megazron.github.io/text-to-robot/"
Source = "https://github.com/megazron/text-to-robot"
Issues = "https://github.com/megazron/text-to-robot/issues"
Changelog = "https://github.com/megazron/text-to-robot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cad = ["cadquery>=2.5,<3"]
geometry = ["trimesh>=4.5,<5", "coacd>=1.0.7,<2", "rtree>=1.3,<2", "python-fcl>=0.7,<0.8"]
train = ["stable-baselines3>=2.3", "torch>=2.2"]
build = ["build123d>=0.9", "trimesh>=4.5", "matplotlib>=3.7"]

[project.scripts]
ttr-mujoco = "ttr_mujoco.__main__:main"
ttr-enclosure = "ttr_cad.enclosure:main"
ttr-collision = "ttr_mujoco.collision:main"
ttr-attach-enclosure = "ttr_cad.attach:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttr_mujoco*", "ttr_cad*", "ttr_hf*", "ttr_build*"]

[tool.setuptools.package-data]
ttr_cad = ["*.json"]

ttr_mujoco = ["*.json"]

ttr_hf = ["*.json"]
