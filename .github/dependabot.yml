# Dependabot keeps the npm packages and the pinned GitHub Actions (commit SHAs) current; security updates are on in the
# repository settings and open their own pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tools: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
