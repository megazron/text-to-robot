name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm test
      - name: Validate all examples
        run: |
          for d in examples/*/; do
            node cli/src/index.ts validate "$d/robot.urdf" || exit 1
          done
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "./python[cad,geometry]"
      - name: Download and exercise pinned Hugging Face SO-101 assets
        run: python scripts/benchmark_hf_so101.py --episodes 4 --output /tmp/so101-ci
      - name: Physical fidelity and solid CAD regression tests
        run: python -m unittest discover -s python/tests -v
      - name: Verify example reports and animations match shipped models
        run: python scripts/verify_example_artifacts.py
      - name: Verify visual evidence matches the exported model
        run: python scripts/mark43_reference_review.py --check-renders
      - name: Independent STL topology and mass-integral audit
        run: python scripts/check_mesh_assets.py
      # These concepts are not engineered hardware. Keep physical failures visible
      # without encoding "every character can balance" as a software invariant.
      - name: Concept-model diagnostics (physical failures expected)
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          failed=0
          for ex in 02_arm_6dof 08_humanoid 15_wall_e 16_eva 17_baymax; do
            if ! python -m ttr_mujoco test examples/$ex/robot.urdf --json diagnostics/$ex.json; then failed=1; fi
          done
          if ! python -m ttr_mujoco test examples/14_iron_man_mark_43/robot.sim.urdf --wearer --json diagnostics/mark43_wearer.json; then failed=1; fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concept-physics-diagnostics
          path: diagnostics/
