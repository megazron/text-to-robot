name: CI
on: [push, pull_request]
# read-only token for every job: CI only checks out and tests (no pull_request_target, no secrets used)
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Every relative link and image in the Markdown files resolves
        run: python3 scripts/check_links.py
      - run: npm test
      - name: Validate all examples
        run: |
          for d in examples/*/; do
            node cli/src/index.ts validate "$d/robot.urdf" || exit 1
          done
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual rendered meshes and failure recovery
        run: python scripts/check_web.py
  site:
    # the real website: every example prompt typed in, generated in the tab, compared with the shipped example
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: deploy/build-pages.sh pages-dist
      - name: Generate every example on the site, Arduino mode included
        run: python scripts/check_site.py
      - name: The engine API loads into a page on another origin and designs, edits, checks and exports
        run: python scripts/check_engine.py
      - name: Hostile share links and files (script payloads, a deflate bomb, bad names, framing) do nothing under the CSP
        run: python scripts/check_xss.py
      - name: Build from my parts on the site (the My parts picker, option cards, have / to buy, the sketch)
        run: python scripts/check_parts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: site-check
          path: |
            out/site-check/
            out/xss-check/
            out/parts-check/
  community:
    # the community board: the Worker's unit and API tests on Miniflare, then Chromium against wrangler dev and the site.
    # Turnstile uses Cloudflare's test keys and the admin token is made up per run, so no secret is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: npm ci
      - run: npm ci
        working-directory: community
      - name: Validation, filters, rate limits, Turnstile, admin auth, delete token and the API on a local D1
        run: npm test
        working-directory: community
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: deploy/build-pages.sh pages-dist
      - name: Share a design, see it, open it, report it, delete it as the owner and with the private link, offline
        run: python community/test/e2e.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: community-e2e
          path: out/community-e2e/
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      # the shipped simulation evidence is recorded with MuJoCo 3.13.0; contact behaviour (skid-steer turning most) differs
      # between releases, so the re-run check pins the same version
      - run: pip install "./python[cad,geometry]" "mujoco==3.13.0" "manifold3d==3.5.4" "scipy==1.17.1"
      - name: Physical fidelity and solid CAD regression tests
        run: python -m unittest discover -s python/tests -v
      - name: Examples match their pipeline (deliverables, report from the shipped URDF, no failing checks)
        run: python scripts/verify_examples.py
      - name: Every printed part is printable (orientation, supports, walls, one solid); known issues listed with a reason
        run: python scripts/print_audit.py --check
      - name: Re-run every example's MuJoCo task tests (drive, ramp, turn, hold, squat, grip)
        env: { MUJOCO_GL: disable }
        run: python scripts/simulate_examples.py --check
      - name: No two parts pass through each other in any film (every frame, exact meshes)
        env: { MUJOCO_GL: disable }
        run: python scripts/check_motion.py --record
      - name: Independent STL topology and mass-integral audit
        run: python scripts/check_mesh_assets.py
      # These concepts are not engineered hardware. Keep physical failures visible
      # without encoding "every character can balance" as a software invariant.
      - name: Concept-model diagnostics (physical failures expected)
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          failed=0
          for ex in 02_arm_6dof 08_humanoid 16_eva 17_baymax; do
            if ! python -m ttr_mujoco test examples/$ex/robot.urdf --json diagnostics/$ex.json; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: concept-physics-diagnostics
          path: diagnostics/
