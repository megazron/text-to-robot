name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate all examples
        run: |
          for d in examples/*/; do
            node cli/src/index.ts validate "$d/robot.urdf" || exit 1
          done
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify actual rendered meshes and failure recovery
        run: python scripts/check_web.py
  site:
    # the real website: every example prompt typed in, generated in the tab, compared with the shipped example
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: deploy/build-pages.sh pages-dist
      - name: Generate every example on the site, Arduino mode included
        run: python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check
          path: out/site-check/
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # the shipped simulation evidence is recorded with MuJoCo 3.13.0; contact behaviour (skid-steer turning most) differs
      # between releases, so the re-run check pins the same version
      - run: pip install "./python[cad,geometry]" "mujoco==3.13.0"
      - name: Physical fidelity and solid CAD regression tests
        run: python -m unittest discover -s python/tests -v
      - name: Examples match their pipeline (deliverables, report from the shipped URDF, no failing checks)
        run: python scripts/verify_examples.py
      - name: Every printed part is printable (orientation, supports, walls, one solid); known issues listed with a reason
        run: python scripts/print_audit.py --check
      - name: Re-run every example's MuJoCo task tests (drive, ramp, turn, hold, squat, grip)
        env: { MUJOCO_GL: disable }
        run: python scripts/simulate_examples.py --check
      - name: Independent STL topology and mass-integral audit
        run: python scripts/check_mesh_assets.py
      # These concepts are not engineered hardware. Keep physical failures visible
      # without encoding "every character can balance" as a software invariant.
      - name: Concept-model diagnostics (physical failures expected)
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          failed=0
          for ex in 02_arm_6dof 08_humanoid 16_eva 17_baymax; do
            if ! python -m ttr_mujoco test examples/$ex/robot.urdf --json diagnostics/$ex.json; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concept-physics-diagnostics
          path: diagnostics/
