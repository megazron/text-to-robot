name: Feature request
description: Suggest something the app, the CLI or the exports should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the job, not the solution. What were you building, and where did Text to Robot get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      placeholder: Export a KiCad netlist next to wiring.svg.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
